<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIVA VSL Verifier Engine — Online</title>
  <style>
    body {
      background: #090a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 32px 40px;
      max-width: 420px;
      backdrop-filter: blur(20px);
    }
    .badge {
      display: inline-block;
      background: rgba(48, 209, 88, 0.15);
      border: 1px solid rgba(48, 209, 88, 0.4);
      color: #30d158;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 10px 0; }
    p { font-size: 13px; color: #a1a1aa; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● OPERACIONAL</div>
    <h1>VIVA VSL Verifier Engine v2.0</h1>
    <p>O serviço de auditoria em nuvem está ativo e respondendo a requisições de inspeção de VSL e funis.</p>
  </div>
</body>
</html>
